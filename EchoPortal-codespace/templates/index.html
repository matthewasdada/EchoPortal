{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="height: 80vh;">
    <div class="text-center">
        <h1 class="mb-3">Welcome to EchoPortal</h1>
        <p class="mb-4">Secure Photography Delivery Platform</p>

        {% if 'user' not in session %}
        <div class="d-flex justify-content-center gap-3">
            <a href="/about" class="btn btn-primary btn-lg">About us</a>
            <a href="/gallery" class="btn btn-outline-primary btn-lg">View Gallery</a>
        </div>
        {% else %}
            <a href="/gallery" class="btn btn-success btn-lg">Go to Gallery</a>
        {% endif %}
    </div>
</div>
{% endblock %}
