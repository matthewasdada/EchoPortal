<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EchoPortal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <nav class="navbar">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/services">Services</a>
        <a href="/gallery">Gallery</a>
        <a href="/faq">FAQ</a>
        <a href="/testimonials">Testimonials</a>
        <a href="/contact">Contact</a>

        {% if 'user' in session %}
            <a href="/logout">Logout</a>
        {% else %}
            <a href="login">Login</a>
        {% end if %}
    </nav>

    <div class="content">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer">
        <p>2026 EchoPortal Photography Ministry</p>
        <p>Contact: echoportal@example.com</p>
    </footer>
</body>
</html>
