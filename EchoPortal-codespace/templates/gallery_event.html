{% extends "base.html" %}
{% block content %}

<div class="container py-5">

    <div class="text-center mb-4">
        <h1>{{ event_name.replace('-', ' ').title() }}</h1>
        <p class="lead">
            Captured moments from our {{ event_name.replace('-', ' ') }} event.
        </p>
    </div>

    <div class="row g-4">
        {% for img in images %}
        <div class="col-md-4">
            <img src="{{ url_for('static', filename='images/gallery/' ~ event_name ~ '/' ~ img) }}"
                 class="img-fluid rounded shadow">
        </div>
        {% endfor %}
    </div>

    <div class="mt-5 text-center">
        <a href="/gallery" class="btn btn-secondary">Back to Gallery</a>
    </div>

</div>

{% endblock %}
