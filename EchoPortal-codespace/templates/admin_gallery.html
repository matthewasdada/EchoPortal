<h1>Manage Gallery</h1>

<h3>Existing Sections</h3>
<ul>
{% for folder in folders %}
    <li>
        {{ folder.replace('-', ' ').title() }}

        <form action="/admin/delete-gallery/{{ folder }}" method="POST" onsubmit="return confirm('Delete this gallery section and all photos inside it?');">
            <button class="btn btn-danger btn-sm">Delete</button>
        </form>
    </li>
{% endfor %}
</ul>

<h3>Create New Section</h3>
<form action="/admin/create-gallery" method="POST">
    {{ csrf_token() }}
    <input type="text" name="new_folder" placeholder="e.g. christmas-service" required>
    <button class="btn btn-primary">Create</button>
</form>

<h3>Upload Photo</h3>
<form action="/upload" method="GET">
    <button class="btn btn-secondary">Go to Upload Page</button>
</form>
