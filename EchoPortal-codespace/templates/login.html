{% extends "base.html" %}
{% block content %}

<h2>Login</h2>

{% if error %}
<p style="color: red;">{{ error }}</p>
{% endif %}

<div class="d-flex justify-content-center align-items-center" style="height: 80vh;">
    <div class="card p-4 shadow" style="width: 350px;">
        <h2 class="text-center mb-3">Login</h2>

        <form method="POST">
            <input type="test" name="username" class="form-control mb-3" placeholder="Username" required>
            <input type="password" name="password" class="form-control mb-3" placeholder="Password" required><br><br>
            <button type="submit" class=""btn btn-primary w-100>Login</button>
        </form>
    </div>
</div>

{% endblock %}
