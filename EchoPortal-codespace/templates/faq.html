{% extends "base.html" %}
{% block content %}

<div class="container py-5">
    <h1 class="text-center mb-4">Frequently Asked Questions</h1>

    <div class="accordion" id="faqAccordion">

        <div class="accordion-item">
            <h2 class="accordion-header" id="faq1">
                <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#answer1">
                    How long does it take to receieve photos?
                </button>
            </h2>
            <div id="answer1" class="accordion-collapse collapse" data-bs-parent="#faqAccordion">
                <div class="accordion-body">
                    Most photos are delivered within 4-7 days.
                </div>
            </div>
        </div>

        <div class="accordion-item">
            <h2 class="accordion-header" id="faq2">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#answer2">
                    Do the photos undergo editing?
                </button>
            </h2>
            <div id="answer2" class="accordion-collapse collapse" data-bs-parent="#faqAccordion">
                <div class="accordion-body">
                    Yes, all photos undergo the process of light editing for clarity and colour.
                </div>
            </div>
        </div>

        <div class="accordion-item">
            <h2 class="accordion-header" id="faq3">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#answer3">
                    Where to access the photos?
                </button>
            </h2>
            <div id="answer3" class="accordion-collapse collapse" data-bs-parent="#faqAccordion">
                <div class="accordion-body">
                    You can view them securely by going through the EchoPortal gallery.
                </div>
            </div>
        </div>

    </div>
</div>

{% endblock %}
